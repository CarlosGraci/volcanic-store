 <style>

        .accordion-container {
            display: flex;
            height: 400px; /* Altura fixa */
            overflow: hidden; /* Para os cantos arredondados */
            gap: 20px;
        }

        .panel {
            position: relative;
            /* Por padrão, todos os painéis são flex: 1 (fechados) */
            flex: 1; 
            height: 100%;
            overflow: hidden;
            display: flex; /* Para alinhar imagem e texto */
            
            /* A mágica da animação de expandir/contrair */
            transition: flex 0.7s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .panel-image {
            width: 100%; /* No estado fechado, a imagem ocupa 100% */
            height: 100%;
            object-fit: cover; /* Garante que a imagem cubra o espaço */
            object-position: center;
            filter: brightness(0.9); /* Leve escurecida na imagem */
            
            /* Animação da largura da imagem */
            transition: width 0.7s cubic-bezier(0.165, 0.84, 0.44, 1);
            border-radius: 16px;
        }

        .panel-text {
            /* Por padrão, o texto não tem largura e está invisível */
            width: 0;
            opacity: 0;
            padding: 0;
            box-sizing: border-box;
            
            /* Centraliza o conteúdo de texto verticalmente */
            display: flex;
            flex-direction: column;
            justify-content: center;
            
            /* Animação da largura e opacidade */
            transition: width 0.7s cubic-bezier(0.165, 0.84, 0.44, 1),
                        opacity 0.4s ease 0.3s, /* A opacidade espera a largura aumentar */
                        padding 0.7s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        
        /* * NOVO: ESTADO INICIAL ABERTO 
         * Aplica o estilo de "aberto" ao painel com a classe .active
         */
        .panel.active {
            flex: 6;
        }
        .panel.active .panel-image {
            width: 60%;
            filter: brightness(1);
        }
        .panel.active .panel-text {
            width: 40%;
            opacity: 1;
            padding: 20px;
        }

        /* * O EFEITO HOVER 
         */

        /* 1. Quando o container PAI sofre hover... */
        .accordion-container:hover .panel {
            /* ...TODOS os painéis (incluindo o .active) voltam ao normal (fechado) */
            flex: 1;
        }
        .accordion-container:hover .panel .panel-image {
            width: 100%;
            filter: brightness(0.9);
        }
        .accordion-container:hover .panel .panel-text {
            width: 0;
            opacity: 0;
            padding: 0;
        }

        /* 2. ...EXCETO o painel FILHO que está sofrendo o hover */
        .accordion-container:hover .panel:hover {
            /* O painel com hover se expande */
            flex: 6; 
        }
        .accordion-container:hover .panel:hover .panel-image {
            width: 60%; 
            filter: brightness(1);
        }
        .accordion-container:hover .panel:hover .panel-text {
            width: 40%;
            opacity: 1;
            padding: 20px; 
        }


        /* Estilização do texto (como no seu design) */
        .panel-text h3 {
            margin: 0 0 10px 0;
            font-size: 20px; /* 22px */
            color: #000;
            text-transform: uppercase;
            font-weight: 700;
        }

        .panel-text p {
            margin: 0 0 20px 0;
            font-size: 16px; /* 14px */
            color: #717378;
            line-height: 1.6;
        }

        .panel-text a {
            font-size: 0.9rem;
            color: #000;
            text-decoration: underline;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .accordion-container {
                flex-direction: column;
                height: auto;
            }
            .panel {
                flex: none;
                width: 100%;
                height: auto;
                flex-direction: column;
            }
            .panel-image {
                width: 100% !important;
                height: auto;
                margin-bottom: 15px;
            }
            .panel-text {
                width: 100% !important;
                opacity: 1 !important;
                padding: 0px !important;
            }
            .blog{
              margin: 0;
            }
        }

    </style>



<section class="blog">
  <div class="container">
    <h3 class="section-title" style="border:0">
      <img src="{{ asset('img/icon-fire.svg') }}" alt="">Fique por dentro do nosso blog
    </h3>
    <div class="accordion-container"></div>
  </div>
</section>

<script>
(function () {
  var container = document.querySelector('.accordion-container');
  if (!container) return;
  var API = 'https://blog.volcanicstore.com/wp-json/wp/v2/posts?per_page=3&_embed&_fields=title,link,excerpt,jetpack_featured_media_url,_links,_embedded';
  var CHAVE = 'volcanic_blog_posts_v1';
  var IMG_PADRAO = '{{ asset("img/modelo/blog1.jpg") }}';

  function textoLimpo(html) { var d = document.createElement('div'); d.innerHTML = html || ''; return (d.textContent || '').trim(); }

  // Converte a resposta do WordPress em dados simples (título, link, resumo, imagem)
  function simplificar(posts) {
    return posts.slice(0, 3).map(function (post) {
      var img = post.jetpack_featured_media_url ||
        (post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0] && post._embedded['wp:featuredmedia'][0].source_url) ||
        IMG_PADRAO;
      return {
        titulo: textoLimpo(post.title && post.title.rendered),
        link: post.link,
        resumo: textoLimpo(post.excerpt && post.excerpt.rendered).substring(0, 150),
        imagem: img
      };
    });
  }

  function desenhar(lista) {
    container.innerHTML = '';
    lista.forEach(function (item, index) {
      var panel = document.createElement('div');
      panel.className = 'panel' + (index === 0 ? ' active' : '');

      var img = document.createElement('img');
      img.className = 'panel-image'; img.src = item.imagem; img.alt = item.titulo; img.loading = 'lazy';
      img.onerror = function () { this.onerror = null; this.src = IMG_PADRAO; };

      var txt = document.createElement('div'); txt.className = 'panel-text';
      var h = document.createElement('h3'); h.textContent = item.titulo;
      var p = document.createElement('p'); p.textContent = item.resumo + '...';
      var a = document.createElement('a'); a.href = item.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Ver mais';
      txt.appendChild(h); txt.appendChild(p); txt.appendChild(a);

      panel.appendChild(img); panel.appendChild(txt);
      container.appendChild(panel);
    });
  }

  function lerReserva() { try { var c = JSON.parse(localStorage.getItem(CHAVE)); return c && c.length ? c : null; } catch (e) { return null; } }
  function salvarReserva(lista) { try { localStorage.setItem(CHAVE, JSON.stringify(lista)); } catch (e) {} }

  function buscar(tentativa) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 8000);
    return fetch(API, ctrl ? { signal: ctrl.signal } : {})
      .then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (posts) { if (!posts || !posts.length) throw new Error('sem posts'); return simplificar(posts); })
      .catch(function (err) {
        clearTimeout(timer);
        if (tentativa < 2) return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return buscar(tentativa + 1); });
        throw err;
      });
  }

  function iniciar() {
    // 1) Sempre busca os 3 posts mais recentes no blog
    buscar(1).then(function (lista) {
      desenhar(lista);
      salvarReserva(lista); // guarda como reserva para quando o blog falhar
    }).catch(function (err) {
      console.error('Blog indisponível, usando reserva:', err);
      // 2) Só se o blog falhar: mostra os últimos posts que carregaram com sucesso
      var reserva = lerReserva();
      if (reserva) { desenhar(reserva); return; }
      // 3) Sem reserva (primeira visita e blog fora do ar): esconde a seção
      var secao = container.closest('section.blog'); if (secao) secao.style.display = 'none';
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
})();
</script>
